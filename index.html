<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой сайт</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
        }

        header {
            background: #222;
            color: white;
            padding: 25px;
        }

        h1 {
            margin: 0;
        }

        main {
            padding: 50px 20px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h1>Мой сайт</h1>
    </header>

    <main>
        <h2>Добро пожаловать!</h2>
        <p>Это мой первый сайт.</p>

        <button onclick="alert('Привет!')">
            Нажми меня
        </button>
    </main>

</body>
</html>
